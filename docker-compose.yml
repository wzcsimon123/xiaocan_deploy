services:
  mysql:
    image: mysql:8.0
    container_name: xiaocan-mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-root}
      MYSQL_DATABASE: ${MYSQL_DB:-xiaocan}
      MYSQL_USER: ${MYSQL_USER:-xiaocan}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-xiaocan123}
      TZ: Asia/Shanghai
    volumes:
      - mysql_data:/var/lib/mysql
      - ./mysql/init:/docker-entrypoint-initdb.d:ro
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_0900_ai_ci
      - --default-authentication-plugin=caching_sha2_password
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-uroot", "-p${MYSQL_ROOT_PASSWORD:-root}"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 40s
    networks:
      - xiaocan-net
    # 默认不映射端口到宿主机，更安全；需要本机连库时再打开
    # ports:
    #   - "${MYSQL_PORT:-3306}:3306"

  redis:
    image: redis:7-alpine
    container_name: xiaocan-redis
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5
    networks:
      - xiaocan-net
    # ports:
    #   - "${REDIS_PORT:-6379}:6379"

  backend:
    image: wzcsimon/xiaocan-backend:${IMAGE_TAG:-latest}
    container_name: xiaocan-backend
    restart: unless-stopped
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      MYSQL_HOST: mysql
      MYSQL_PORT: 3306
      MYSQL_DB: ${MYSQL_DB:-xiaocan}
      MYSQL_USER: ${MYSQL_USER:-xiaocan}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-xiaocan123}
      REDIS_HOST: redis
      REDIS_PASSWORD: ${REDIS_PASSWORD:-}
      SYSTEM_WEB_URL: ${SYSTEM_WEB_URL:-}
      TZ: Asia/Shanghai
      JAVA_OPTS: ${JAVA_OPTS:--Xmx256m -Xms128m}
    expose:
      - "10234"
    networks:
      - xiaocan-net

  frontend:
    image: wzcsimon/xiaocan-frontend:${IMAGE_TAG:-latest}
    container_name: xiaocan-frontend
    restart: unless-stopped
    expose:
      - "80"
    networks:
      - xiaocan-net

  nginx:
    image: nginx:1.27-alpine
    container_name: xiaocan-nginx
    restart: unless-stopped
    depends_on:
      - backend
      - frontend
    ports:
      - "${HTTP_PORT:-80}:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    networks:
      - xiaocan-net

volumes:
  mysql_data:
  redis_data:

networks:
  xiaocan-net:
    driver: bridge
